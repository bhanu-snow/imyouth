  <path d="M42 10L46 54" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Ladder Rungs (Steps) -->
  <line x1="21" y1="18" x2="43" y2="18" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <line x1="20.2" y1="26" x2="43.8" y2="26" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <line x1="19.5" y1="34" x2="44.5" y2="34" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <line x1="18.8" y1="42" x2="45.2" y2="42" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <line x1="18.1" y1="50" x2="45.9" y2="50" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
