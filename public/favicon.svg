  <line x1="20.2" y1="26" x2="43.8" y2="26" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>
  <line x1="19.5" y1="34" x2="44.5" y2="34" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
