services:
  imyouth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imyouth-portal
    ports:
      - "3000:3000"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - .:/app
      - imyouth_node_modules:/app/node_modules
    command: ["bun", "run", "dev"]
    restart: unless-stopped

volumes:
  imyouth_node_modules:
